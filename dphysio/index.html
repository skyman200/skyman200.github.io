<title>DIT 국시실</title>
<script>
  // 짧은 주소(skyman200.github.io/dphysio) → 긴 국시실 exec 주소로 즉시 이동
  var EXEC = "https://script.google.com/macros/s/AKfycbz4iT-GM-0By8tW9Dw_U1aIwzA2oxrSkTlUdadge3uhIUbqC7osd721g3pIfOWMJeS6mA/exec";
  var TARGET = EXEC + "?page=prof";
  try {
    var qs = window.location.search;
    if (qs && qs.length > 1) {
      // ?to=... 로 다른 페이지 지정 가능 (예: /dphysio/?to=?page=admin%26key=skyman200)
      var m = /[?&]to=([^&]+)/.exec(qs);
      if (m) { TARGET = EXEC + decodeURIComponent(m[1]); }
    }
  } catch (e) {}
  window.location.replace(TARGET);
</script>
<meta http-equiv="refresh" content="0; url=https://script.google.com/macros/s/AKfycbz4iT-GM-0By8tW9Dw_U1aIwzA2oxrSkTlUdadge3uhIUbqC7osd721g3pIfOWMJeS6mA/exec?page=prof">
