<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow" />
    <title>mobile preview</title>
    <style>
      body { margin: 0; padding: 16px; background: #2a2a2a; display: flex; gap: 20px; font-family: sans-serif; }
      figure { margin: 0; }
      figcaption { color: #ddd; font-size: 12px; padding: 4px 0 8px; }
      iframe { width: 390px; height: 844px; border: 0; background: #fff; display: block; }
    </style>
  </head>
  <body>
    <figure>
      <figcaption>/go/ 390×844</figcaption>
      <iframe src="/go/"></iframe>
    </figure>
    <figure>
      <figcaption>/apply/ 390×844</figcaption>
      <iframe src="/apply/"></iframe>
    </figure>
  </body>
</html>
