<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark" />
<title>DNS 강의영상 갤러리</title>
<meta name="description" content="DNS(Dynamic Neuromuscular Stabilization) 강의영상 아카이브 — 코스별 인라인 재생 갤러리" />
<meta name="robots" content="noindex" />
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --tx:#e7e9ee; --tx2:#9aa2b1; --accent:#4f8cff; --accent2:#2b6be4;
    --good:#3ecf8e; --warn:#f0b23c; --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--tx);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",Segoe UI,Roboto,sans-serif;}
  a{color:var(--accent);text-decoration:none}
  header{position:sticky;top:0;z-index:20;background:rgba(15,17,21,.92);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 18px}
  .hwrap{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .brand{font-weight:800;font-size:18px;letter-spacing:.3px}
  .brand small{color:var(--tx2);font-weight:500;font-size:12px;margin-left:8px}
  .search{flex:1;min-width:180px}
  .search input{width:100%;padding:9px 13px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel2);color:var(--tx);font-size:14px;outline:none}
  .search input:focus{border-color:var(--accent)}
  .stat{color:var(--tx2);font-size:12px;white-space:nowrap}
  main{max-width:1200px;margin:0 auto;padding:16px 18px 80px}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 20px}
  .tab{padding:8px 13px;border-radius:999px;background:var(--panel);border:1px solid var(--line);
    color:var(--tx2);font-size:13px;cursor:pointer;user-select:none;transition:.15s;white-space:nowrap}
  .tab:hover{color:var(--tx);border-color:#3a4150}
  .tab.active{background:var(--accent2);border-color:var(--accent);color:#fff;font-weight:600}
  .tab .n{opacity:.7;font-size:11px;margin-left:5px}
  .course-title{font-size:20px;font-weight:800;margin:6px 0 2px}
  .course-sub{color:var(--tx2);font-size:13px;margin-bottom:16px}
  .topic{margin:26px 0 8px;font-size:15px;font-weight:700;color:#cdd3df;
    border-left:3px solid var(--accent);padding-left:10px}
  .topic .tn{color:var(--tx2);font-weight:500;font-size:12px;margin-left:6px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;cursor:pointer;transition:.15s;display:flex;flex-direction:column}
  .card:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 8px 24px rgba(0,0,0,.35)}
  .thumb{aspect-ratio:16/9;background:linear-gradient(135deg,#232838,#161a24);
    display:flex;align-items:center;justify-content:center;position:relative}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .play{width:46px;height:46px;border-radius:50%;background:rgba(79,140,255,.92);
    display:flex;align-items:center;justify-content:center;position:absolute}
  .play:after{content:"";border-left:15px solid #fff;border-top:9px solid transparent;
    border-bottom:9px solid transparent;margin-left:4px}
  .card .meta{padding:10px 12px}
  .card .t{font-size:13.5px;line-height:1.35;font-weight:600;color:#eef1f6;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .tags{margin-top:7px;display:flex;gap:5px;flex-wrap:wrap}
  .tag{font-size:10.5px;padding:2px 7px;border-radius:6px;background:#232a38;color:#9fb2d6}
  .empty{color:var(--tx2);padding:40px 0;text-align:center}
  .docrow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
  .doc{font-size:12px;padding:6px 11px;border-radius:9px;background:var(--panel2);
    border:1px solid var(--line);color:#c9d2e2}
  .doc:hover{border-color:var(--accent)}
  /* modal */
  .modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.82);
    display:none;align-items:center;justify-content:center;padding:20px}
  .modal.open{display:flex}
  .box{background:#000;border-radius:14px;overflow:hidden;width:min(1000px,96vw);
    max-height:92vh;display:flex;flex-direction:column;border:1px solid #333}
  .box .bar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#12141a}
  .box .bar .ttl{flex:1;font-size:14px;font-weight:600;color:#eef1f6;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .box .bar a{font-size:12px;color:var(--tx2)}
  .x{cursor:pointer;color:#aab;font-size:22px;line-height:1;padding:2px 6px}
  .x:hover{color:#fff}
  .frame{position:relative;width:100%;aspect-ratio:16/9;background:#000}
  .frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  footer{max-width:1200px;margin:0 auto;padding:20px 18px 60px;color:var(--tx2);font-size:12px;line-height:1.6}
  .loading{padding:60px 0;text-align:center;color:var(--tx2)}
  .spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--accent);
    border-radius:50%;animation:sp 1s linear infinite;display:inline-block;vertical-align:middle;margin-right:10px}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="brand">DNS 강의영상 <small>Dynamic Neuromuscular Stabilization</small></div>
    <div class="search"><input id="q" type="search" placeholder="영상 검색 (제목·주제 키워드)…" autocomplete="off" /></div>
    <div class="stat" id="stat"></div>
  </div>
</header>
<main>
  <div class="tabs" id="tabs"></div>
  <div id="view"><div class="loading"><span class="spin"></span>목록 불러오는 중…</div></div>
</main>
<footer id="foot"></footer>

<div class="modal" id="modal">
  <div class="box">
    <div class="bar">
      <div class="ttl" id="mttl"></div>
      <a id="mopen" href="#" target="_blank" rel="noopener">드라이브에서 열기 ↗</a>
      <span class="x" id="mx">×</span>
    </div>
    <div class="frame"><iframe id="mframe" allow="autoplay; fullscreen" allowfullscreen></iframe></div>
  </div>
</div>

<script>
const PREVIEW = id => `https://drive.google.com/file/d/${id}/preview`;
const OPEN = id => `https://drive.google.com/file/d/${id}/view`;
const THUMB = id => `https://drive.google.com/thumbnail?id=${id}&sz=w400`;
let DATA=null, activeCourse=0, query="";

function stripStem(name){
  // remove extension; original stem is a timestamp/id, topic follows first "_" group
  const dot=name.lastIndexOf("."); const base=dot>0?name.slice(0,dot):name;
  return base;
}
function prettyTitle(name){
  const base=stripStem(name);
  // pattern: <stem>_<topic...> ; topic words joined by _
  // heuristics: if there is a korean topic chunk, show it prominently
  const parts=base.split("_").filter(Boolean);
  // find first korean-containing part index
  let ki=parts.findIndex(p=>/[가-힣]/.test(p));
  if(ki>=0){
    const stem=parts.slice(0,ki).join("_");
    const topic=parts.slice(ki).join(" · ");
    return {topic, stem};
  }
  return {topic:base, stem:""};
}
function topicTags(name){
  const {topic}=prettyTitle(name);
  return topic.split(/[ ·_]+/).filter(t=>/[가-힣]/.test(t)).slice(0,4);
}

function allVideos(node, acc){
  for(const f of node.files||[]) if(f.kind==="video") acc.push({...f, _path:node.path});
  for(const c of node.children||[]) allVideos(c, acc);
  return acc;
}
function docsIn(node, acc){
  for(const f of node.files||[]) if(f.kind==="doc") acc.push({...f,_path:node.path});
  for(const c of node.children||[]) docsIn(c, acc);
  return acc;
}

function render(){
  const view=document.getElementById("view");
  const tabs=document.getElementById("tabs");
  const courses=DATA.courses;
  // tabs
  tabs.innerHTML="";
  courses.forEach((c,i)=>{
    const el=document.createElement("div");
    el.className="tab"+(i===activeCourse?" active":"");
    el.innerHTML=`${c.name}<span class="n">${c.video_count}</span>`;
    el.onclick=()=>{activeCourse=i;query="";document.getElementById("q").value="";render();window.scrollTo(0,0)};
    tabs.appendChild(el);
  });

  // search mode: flatten across ALL courses
  if(query.trim()){
    const q=query.trim().toLowerCase();
    const hits=[];
    courses.forEach(c=>allVideos(c,[]).forEach(v=>{
      if(v.name.toLowerCase().includes(q)) hits.push({...v,_course:c.name});
    }));
    view.innerHTML=`<div class="course-title">검색: “${query}”</div>
      <div class="course-sub">${hits.length}개 영상</div>`;
    view.appendChild(cardGrid(hits,true));
    return;
  }

  const c=courses[activeCourse];
  if(!c){view.innerHTML=`<div class="empty">코스가 없습니다.</div>`;return;}
  let html=`<div class="course-title">${c.name}</div>
    <div class="course-sub">${c.video_count}개 영상</div>`;
  const wrap=document.createElement("div");
  wrap.innerHTML=html;

  // course-level docs
  const cdocs=docsIn(c,[]);
  if(cdocs.length){
    const dr=document.createElement("div");dr.className="docrow";
    cdocs.slice(0,12).forEach(d=>{
      const a=document.createElement("a");a.className="doc";a.href=OPEN(d.id);
      a.target="_blank";a.rel="noopener";a.textContent="📄 "+d.name;dr.appendChild(a);
    });
    wrap.appendChild(dr);
  }

  // topics = immediate children with videos; also direct files
  const direct=(c.files||[]).filter(f=>f.kind==="video");
  if(direct.length){
    wrap.appendChild(topicHeader("(코스 최상위)", direct.length));
    wrap.appendChild(cardGrid(direct.map(v=>({...v,_path:c.path}))));
  }
  (function walk(node){
    for(const ch of node.children||[]){
      const vids=allVideos(ch,[]);
      if(vids.length){
        wrap.appendChild(topicHeader(ch.name, vids.length));
        // show videos that are direct in ch first, then nested
        wrap.appendChild(cardGrid(vids));
      }
    }
  })(c);

  if(c.video_count===0){
    const e=document.createElement("div");e.className="empty";
    e.textContent="이 코스에는 아직 영상이 없습니다.";wrap.appendChild(e);
  }
  view.innerHTML="";view.appendChild(wrap);
}

function topicHeader(name,n){
  const d=document.createElement("div");d.className="topic";
  d.innerHTML=`${name}<span class="tn">${n}개</span>`;return d;
}
function cardGrid(vids,showCourse){
  const g=document.createElement("div");g.className="grid";
  vids.forEach(v=>{
    const {topic}=prettyTitle(v.name);
    const card=document.createElement("div");card.className="card";
    const tags=topicTags(v.name).map(t=>`<span class="tag">${t}</span>`).join("");
    card.innerHTML=`
      <div class="thumb">
        <img loading="lazy" src="${THUMB(v.id)}" onerror="this.style.display='none'"/>
        <div class="play"></div>
      </div>
      <div class="meta">
        <div class="t">${topic||v.name}</div>
        <div class="tags">${tags}</div>
      </div>`;
    card.onclick=()=>openModal(v);
    g.appendChild(card);
  });
  return g;
}

function openModal(v){
  const {topic}=prettyTitle(v.name);
  document.getElementById("mttl").textContent=topic||v.name;
  document.getElementById("mframe").src=PREVIEW(v.id);
  document.getElementById("mopen").href=OPEN(v.id);
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow="hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.getElementById("mframe").src="";
  document.body.style.overflow="";
}
document.getElementById("mx").onclick=closeModal;
document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")closeModal()};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
document.getElementById("q").addEventListener("input",e=>{query=e.target.value;render()});

fetch("manifest.json?v="+Date.now()).then(r=>{
  if(!r.ok) throw new Error("manifest "+r.status);
  return r.json();
}).then(d=>{
  DATA=d;
  document.getElementById("stat").textContent=`${d.total_videos}개 영상 · ${d.courses.length}개 코스`;
  document.getElementById("foot").innerHTML=
    `DNS 강의영상 아카이브 · 총 ${d.total_videos}개 영상 · 재생은 Google Drive 스트리밍(서버 비용 0)<br>`+
    `무단 배포 금지 · 수강생 학습용`;
  render();
}).catch(e=>{
  document.getElementById("view").innerHTML=
    `<div class="empty">목록을 불러오지 못했습니다.<br><small>${e.message}</small><br><br>`+
    `manifest.json 이 아직 생성되지 않았을 수 있습니다.</div>`;
});
</script>
</body>
</html>
