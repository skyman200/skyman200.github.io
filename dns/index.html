<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="color-scheme" content="dark light" />
<meta name="theme-color" content="#0b1a1e" />
<title>DNS 강의 아카이브</title>
<meta name="description" content="Dynamic Neuromuscular Stabilization 강의영상 아카이브" />
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://drive.google.com">
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
:root{
  /* clinical / calm — not bootstrap blue */
  --brand:#0f9d8f;            /* deep teal */
  --brand-ink:#0a6f66;
  --brand-soft:rgba(15,157,143,.14);
  --accent:#e6b450;           /* warm amber, used sparingly */

  --bg:#0a1417;               /* near-black teal */
  --bg-2:#0e1c20;
  --surface:#12242a;
  --surface-2:#173038;
  --line:#20393f;
  --line-2:#2b4a52;

  --tx:#eaf2f1;
  --tx-2:#9fb4b3;
  --tx-3:#6f8785;

  --r-sm:8px; --r:12px; --r-lg:18px; --r-xl:26px;
  --sp:8px;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.28);
  --shadow-lg:0 12px 48px rgba(0,0,0,.45);
  --sidebar-w:264px;
  --header-h:60px;
  --ff:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;
}
html[data-theme="light"]{
  --bg:#f5f7f7; --bg-2:#eef2f2; --surface:#ffffff; --surface-2:#f0f4f4;
  --line:#e0e7e7; --line-2:#cdd9d9;
  --tx:#0f2226; --tx-2:#476067; --tx-3:#7f9599;
  --brand-soft:rgba(15,157,143,.12);
  --shadow:0 1px 2px rgba(16,40,44,.06), 0 6px 20px rgba(16,40,44,.08);
  --shadow-lg:0 16px 50px rgba(16,40,44,.16);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--tx);font-family:var(--ff);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  line-height:1.5;overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
::selection{background:var(--brand-soft)}
/* scrollbars */
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:20px;border:2px solid transparent;background-clip:padding-box}
*::-webkit-scrollbar-thumb:hover{background:var(--tx-3)}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh}

/* sidebar */
.side{
  position:sticky;top:0;height:100vh;overflow-y:auto;
  background:var(--bg-2);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:0;
}
.side-head{padding:18px 18px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg-2);z-index:2}
.logo{display:flex;align-items:center;gap:11px}
.logo .mark{width:34px;height:34px;border-radius:10px;flex:none;
  background:linear-gradient(135deg,var(--brand),var(--brand-ink));
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;letter-spacing:-.5px;
  box-shadow:0 4px 14px rgba(15,157,143,.35)}
.logo .txt b{display:block;font-size:15px;font-weight:800;letter-spacing:-.2px}
.logo .txt span{display:block;font-size:11px;color:var(--tx-3);letter-spacing:.02em;margin-top:1px}
.nav{padding:10px 10px 24px;flex:1}
.nav .grp{font-size:10.5px;font-weight:700;color:var(--tx-3);text-transform:uppercase;
  letter-spacing:.08em;padding:14px 10px 6px}
.nav a.item{
  display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:var(--r-sm);
  color:var(--tx-2);font-size:13.5px;font-weight:500;transition:background .12s,color .12s;
  position:relative;
}
.nav a.item:hover{background:var(--surface);color:var(--tx)}
.nav a.item.active{background:var(--brand-soft);color:var(--tx);font-weight:700}
.nav a.item.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;
  border-radius:3px;background:var(--brand)}
.nav a.item .ic{width:18px;text-align:center;font-size:14px;opacity:.9;flex:none}
.nav a.item .lbl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav a.item .cnt{font-size:11px;font-weight:700;color:var(--tx-3);
  background:var(--surface);padding:1px 8px;border-radius:20px;min-width:24px;text-align:center}
.nav a.item.active .cnt{background:var(--brand);color:#fff}
.nav a.item.empty{opacity:.4}
.nav a.item.empty .cnt{display:none}

/* main */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:10;height:var(--header-h);
  display:flex;align-items:center;gap:12px;padding:0 20px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
}
.burger{display:none;width:40px;height:40px;border:1px solid var(--line);border-radius:10px;
  background:var(--surface);color:var(--tx);font-size:17px;align-items:center;justify-content:center}
.searchbox{flex:1;max-width:520px;position:relative}
.searchbox .si{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--tx-3);font-size:14px;pointer-events:none}
.searchbox input{width:100%;height:40px;padding:0 14px 0 36px;border-radius:11px;
  border:1px solid var(--line);background:var(--surface);color:var(--tx);font-size:14px;outline:none;transition:.15s}
.searchbox input::placeholder{color:var(--tx-3)}
.searchbox input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.spacer{flex:1}
.tbtn{width:40px;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--surface);
  color:var(--tx-2);font-size:16px;display:grid;place-items:center;transition:.15s}
.tbtn:hover{color:var(--tx);border-color:var(--line-2)}

.content{padding:24px 28px 96px;max-width:1320px;width:100%;margin:0 auto}

/* hero / course head */
.chead{margin:6px 0 22px}
.chead .eyebrow{font-size:12px;font-weight:700;color:var(--brand);letter-spacing:.04em;margin-bottom:7px}
.chead h1{margin:0;font-size:clamp(22px,3.4vw,32px);font-weight:800;letter-spacing:-.5px;line-height:1.15}
.chead .sub{margin-top:8px;color:var(--tx-2);font-size:14px;display:flex;gap:14px;flex-wrap:wrap}
.chead .sub b{color:var(--tx);font-weight:700}

.docrow{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0 4px}
.doc{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;padding:8px 13px;border-radius:10px;
  background:var(--surface);border:1px solid var(--line);color:var(--tx-2);transition:.15s;font-weight:500}
.doc:hover{border-color:var(--brand);color:var(--tx)}

/* topic section */
.topic{display:flex;align-items:baseline;gap:10px;margin:32px 0 14px}
.topic h2{margin:0;font-size:16px;font-weight:800;letter-spacing:-.2px}
.topic .dot{width:6px;height:6px;border-radius:50%;background:var(--brand);flex:none}
.topic .n{font-size:12px;color:var(--tx-3);font-weight:600}
.topic .line{flex:1;height:1px;background:var(--line);margin-left:4px}

/* grid + cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  overflow:hidden;cursor:pointer;transition:transform .16s cubic-bezier(.2,.7,.3,1),border-color .16s,box-shadow .16s;
  display:flex;flex-direction:column}
.card:hover{transform:translateY(-3px);border-color:var(--line-2);box-shadow:var(--shadow-lg)}
.card:active{transform:translateY(-1px)}
.thumb{aspect-ratio:16/9;position:relative;background:
  linear-gradient(135deg,var(--surface-2),var(--bg-2));overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;transition:transform .35s ease}
.card:hover .thumb img{transform:scale(1.05)}
.thumb .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--tx-3);font-size:30px;opacity:.4}
.thumb .dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.78);color:#fff;
  font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;letter-spacing:.02em}
.thumb .play{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:opacity .16s;
  background:linear-gradient(to top,rgba(0,0,0,.35),rgba(0,0,0,.05))}
.card:hover .thumb .play{opacity:1}
.thumb .play i{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.94);
  display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.thumb .play i::after{content:"";border-left:16px solid var(--brand-ink);border-top:10px solid transparent;
  border-bottom:10px solid transparent;margin-left:4px}
.card .meta{padding:12px 14px 14px}
.card .t{font-size:14px;line-height:1.4;font-weight:700;letter-spacing:-.2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.8em}
.card .tags{margin-top:9px;display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:600;padding:3px 9px;border-radius:7px;
  background:var(--brand-soft);color:var(--brand)}
html[data-theme="light"] .tag{color:var(--brand-ink)}

.empty{color:var(--tx-3);padding:70px 20px;text-align:center;font-size:14px}
.empty .big{font-size:40px;opacity:.4;margin-bottom:12px}

/* skeleton */
.sk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.sk .b{background:linear-gradient(90deg,var(--surface) 25%,var(--surface-2) 37%,var(--surface) 63%);
  background-size:400% 100%;animation:sh 1.3s ease infinite}
.sk .b1{aspect-ratio:16/9}
.sk .b2{height:14px;margin:14px 14px 8px;border-radius:6px}
.sk .b3{height:14px;width:60%;margin:0 14px 18px;border-radius:6px}
@keyframes sh{0%{background-position:100% 0}100%{background-position:-100% 0}}

/* modal / player */
.modal{position:fixed;inset:0;z-index:60;background:rgba(4,10,12,.86);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;padding:24px}
.modal.open{display:flex;animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;
  width:min(940px,96vw);max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.box .bar{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.box .bar .ttl{flex:1;font-size:14.5px;font-weight:700;letter-spacing:-.2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.box .bar a.ext{font-size:12.5px;color:var(--tx-2);white-space:nowrap}
.box .bar a.ext:hover{color:var(--brand)}
.box .bar .tx-toggle{font-size:12.5px;font-weight:600;color:var(--tx-2);white-space:nowrap;
  padding:6px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);display:none}
.box .bar .tx-toggle.on{color:var(--brand);border-color:var(--brand)}
.box .bar .tx-toggle:hover{color:var(--tx);border-color:var(--line-2)}
.box .bar .x{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:transparent;
  color:var(--tx-2);font-size:19px;display:grid;place-items:center;flex:none}
.box .bar .x:hover{color:var(--tx);border-color:var(--line-2)}
/* body: video on top, transcript below */
.box .body{display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden}
.frameWrap{flex:none;background:#000;display:grid;place-items:center;width:100%}
.frame{position:relative;aspect-ratio:16/9;height:46vh;max-width:100%;background:#000}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
/* transcript panel (below the video) */
.tx{flex:1;min-height:20vh;border-top:1px solid var(--line);background:var(--bg-2);
  display:none;flex-direction:column}
.box.tx-open .tx{display:flex}
.tx-head{padding:11px 16px 10px;border-bottom:1px solid var(--line);flex:none;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tx-head b{font-size:12.5px;font-weight:800;letter-spacing:.02em;flex:none}
.tx-head .badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;
  background:var(--accent);color:#3a2a06;flex:none}
.tx-head .cnt{font-size:11px;color:var(--tx-3);font-weight:600;flex:none}
.tx-head .sp{flex:1}
.tx-find{position:relative;flex:none;width:min(240px,52vw)}
.tx-find input{width:100%;height:32px;padding:0 11px 0 29px;border-radius:8px;
  border:1px solid var(--line);background:var(--surface);color:var(--tx);font-size:12.5px;outline:none}
.tx-find input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.tx-find .ic{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--tx-3);font-size:12px;pointer-events:none}
.tx-body{flex:1;overflow-y:auto;padding:16px 20px 22px;font-size:14px;line-height:1.9;
  color:var(--tx-2);white-space:pre-wrap;word-break:break-word;max-width:76ch}
.tx-body mark{background:var(--brand-soft);color:var(--tx);border-radius:3px;padding:0 2px;font-weight:700}
.tx-note{margin-top:16px;padding-top:12px;border-top:1px dashed var(--line);
  font-size:11.5px;color:var(--tx-3);line-height:1.6}
.tx-empty{padding:36px 18px;text-align:center;color:var(--tx-3);font-size:13px}
.tx-empty .big{font-size:32px;opacity:.4;margin-bottom:10px}
.card .thumb .cc{position:absolute;left:8px;bottom:8px;background:rgba(15,157,143,.92);color:#fff;
  font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;letter-spacing:.02em;display:flex;align-items:center;gap:3px}

/* mobile drawer scrim */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:29;display:none}
.scrim.show{display:block}

/* ---------- auth gate ---------- */
.gate{position:fixed;inset:0;z-index:100;display:none;place-items:center;padding:24px;
  background:radial-gradient(1200px 600px at 50% -10%,var(--surface-2),var(--bg));}
.gate.show{display:grid}
.gate .card{width:min(420px,94vw);background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-xl);padding:38px 32px 30px;box-shadow:var(--shadow-lg);text-align:center}
.gate .mark{width:56px;height:56px;border-radius:16px;margin:0 auto 18px;
  background:linear-gradient(135deg,var(--brand),var(--brand-ink));display:grid;place-items:center;
  color:#fff;font-weight:800;font-size:20px;letter-spacing:-.5px;box-shadow:0 8px 24px rgba(15,157,143,.4)}
.gate h1{margin:0 0 8px;font-size:22px;font-weight:800;letter-spacing:-.4px}
.gate p{margin:0 0 6px;color:var(--tx-2);font-size:14px;line-height:1.6}
.gate .note{color:var(--tx-3);font-size:12.5px;margin:14px 0 24px}
.gate .dbtn{width:100%;height:50px;border:0;border-radius:13px;font-size:15px;font-weight:700;
  color:#fff;background:#5865F2;display:flex;align-items:center;justify-content:center;gap:10px;
  transition:filter .15s,transform .1s}
.gate .dbtn:hover{filter:brightness(1.08)}
.gate .dbtn:active{transform:translateY(1px)}
.gate .dbtn svg{width:22px;height:22px;fill:#fff;flex:none}
.gate .err{margin-top:16px;font-size:13px;color:#ff8080;min-height:18px}
.gate .who{margin-top:18px;font-size:12px;color:var(--tx-3)}
.gate .who a{color:var(--brand);cursor:pointer}
.gate .spin{margin-top:16px;font-size:13px;color:var(--tx-3)}

/* ---------- responsive ---------- */
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;z-index:30;width:min(84vw,300px);
    transform:translateX(-100%);transition:transform .22s cubic-bezier(.2,.7,.3,1);
    box-shadow:var(--shadow-lg)}
  .side.open{transform:none}
  .burger{display:grid}
  .content{padding:18px 16px 90px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .card .meta{padding:10px 11px 12px}
  .card .t{font-size:12.5px;min-height:2.7em}
  .tag{font-size:10px;padding:2px 7px}
  .topbar{padding:0 12px;gap:8px}
  .content{padding-top:14px}
  .modal{padding:0;align-items:flex-end}
  .box{width:100vw;max-height:100vh;height:100vh;border-radius:0}
  .frame{height:auto;width:100%}
  .box.tx-open .frame{height:auto}
  .tx-body{padding:14px 16px 22px;font-size:14px;max-width:100%}
  .box .bar .tx-toggle{padding:6px 9px}
}
@media (max-width:420px){
  .grid{grid-template-columns:1fr 1fr;gap:10px}
}
@supports(padding:max(0px)){
  .side-head{padding-top:max(18px,env(safe-area-inset-top))}
  .topbar{padding-left:max(12px,env(safe-area-inset-left))}
}
</style>
</head>
<body>
<!-- AUTH GATE (hidden unless gate.json enabled) -->
<div class="gate" id="gate">
  <div class="card">
    <div class="mark">DNS</div>
    <h1 id="gateTitle">DNS 강의 아카이브</h1>
    <p id="gateSub">수강생 전용 · 디스코드 인증이 필요합니다</p>
    <div class="note" id="gateNote"></div>
    <button class="dbtn" id="gateLogin">
      <svg viewBox="0 0 24 24"><path d="M20.3 4.4A19.8 19.8 0 0 0 15.4 3l-.24.5c1.6.38 2.9.97 4.13 1.77-2.2-1.02-4.4-1.53-6.79-1.53s-4.6.51-6.79 1.53C7.02 4.47 8.32 3.88 9.9 3.5L9.66 3A19.8 19.8 0 0 0 4.7 4.4C1.6 9 .77 13.5 1.18 17.9a19.9 19.9 0 0 0 6.06 3.06l.73-1.02c-1.02-.38-1.98-.87-2.86-1.5.24.17.53.34.79.5 2.02.94 4.15 1.4 6.35 1.4s4.33-.46 6.35-1.4c.26-.16.55-.33.79-.5-.88.63-1.84 1.12-2.86 1.5l.73 1.02a19.9 19.9 0 0 0 6.06-3.06c.48-5.09-.85-9.55-3.7-13.5ZM8.53 15.4c-1.18 0-2.15-1.09-2.15-2.42s.95-2.42 2.15-2.42 2.17 1.09 2.15 2.42c0 1.33-.96 2.42-2.15 2.42Zm6.94 0c-1.18 0-2.15-1.09-2.15-2.42s.95-2.42 2.15-2.42 2.17 1.09 2.15 2.42c0 1.33-.95 2.42-2.15 2.42Z"/></svg>
      Discord로 로그인
    </button>
    <div class="err" id="gateErr"></div>
    <div class="spin" id="gateSpin" style="display:none">인증 확인 중…</div>
  </div>
</div>

<div class="app">
  <!-- SIDEBAR -->
  <aside class="side" id="side">
    <div class="side-head">
      <a class="logo" href="#">
        <span class="mark">DNS</span>
        <span class="txt"><b>강의 아카이브</b><span>Dynamic Neuromuscular Stabilization</span></span>
      </a>
    </div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <div class="scrim" id="scrim"></div>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <button class="burger" id="burger" aria-label="메뉴">☰</button>
      <div class="searchbox">
        <span class="si">⌕</span>
        <input id="q" type="search" placeholder="영상·주제 검색…" autocomplete="off" />
      </div>
      <div class="spacer"></div>
      <button class="tbtn" id="theme" aria-label="테마 전환" title="라이트/다크">◐</button>
    </div>
    <div class="content" id="view"></div>
  </div>
</div>

<!-- PLAYER MODAL -->
<div class="modal" id="modal">
  <div class="box" id="mbox">
    <div class="bar">
      <div class="ttl" id="mttl"></div>
      <button class="tx-toggle" id="mtxToggle" aria-pressed="false">📝 대본</button>
      <a class="ext" id="mopen" href="#" target="_blank" rel="noopener">Drive에서 열기 ↗</a>
      <button class="x" id="mx" aria-label="닫기">×</button>
    </div>
    <div class="body">
      <div class="frameWrap">
        <div class="frame"><iframe id="mframe" allow="autoplay; fullscreen" allowfullscreen></iframe></div>
      </div>
      <section class="tx" id="mtx">
        <div class="tx-head">
          <b>대본</b>
          <span class="badge" id="mtxBadge" style="display:none">요약</span>
          <span class="cnt" id="mtxCnt"></span>
          <span class="sp"></span>
          <div class="tx-find"><span class="ic">⌕</span>
            <input id="mtxFind" type="search" placeholder="대본 내 찾기" autocomplete="off" /></div>
        </div>
        <div class="tx-body" id="mtxBody"></div>
      </section>
    </div>
  </div>
</div>

<script>
const PREVIEW = id => `https://drive.google.com/file/d/${id}/preview`;
const OPEN    = id => `https://drive.google.com/file/d/${id}/view`;
const THUMB   = id => `https://drive.google.com/thumbnail?id=${id}&sz=w640`;
const $ = s => document.querySelector(s);
let DATA=null, activeCourse=0, query="";

/* ---- transcripts (lazy) ---- */
let TX=null, TXloading=null, curTxId=null;
function loadTx(){
  if(TX) return Promise.resolve(TX);
  if(TXloading) return TXloading;
  TXloading=fetch("transcripts.json?v="+Date.now())
    .then(r=>r.ok?r.json():{by_id:{}})
    .then(d=>{TX=d.by_id||{};return TX;})
    .catch(()=>{TX={};return TX;});
  return TXloading;
}
const hasTx = id => !!(TX && TX[id]);
function escHtml(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");}

/* ---- theme ---- */
(function(){
  const saved=localStorage.getItem("dns-theme");
  if(saved) document.documentElement.dataset.theme=saved;
})();
$("#theme").onclick=()=>{
  const cur=document.documentElement.dataset.theme==="light"?"dark":"light";
  document.documentElement.dataset.theme=cur;localStorage.setItem("dns-theme",cur);
};

/* ---- name parsing ---- */
function stem(name){const d=name.lastIndexOf(".");return d>0?name.slice(0,d):name;}
function parse(name){
  const parts=stem(name).split("_").filter(Boolean);
  const ki=parts.findIndex(p=>/[가-힣]/.test(p));
  if(ki>=0) return {topic:parts.slice(ki).join(" · "), tags:parts.slice(ki).filter(p=>/[가-힣]/.test(p)).slice(0,3)};
  return {topic:stem(name), tags:[]};
}
/* course icon by prefix keyword */
function courseIcon(name){
  if(/시작|안내|필독/.test(name))return"📌";
  if(/공통|기초/.test(name))return"📖";
  if(/임상/.test(name))return"🩺";
  if(/Exercise/i.test(name))return"🤸";
  if(/Strength/i.test(name))return"🏋️";
  if(/Pediatric/i.test(name))return"🧒";
  if(/Golf|스포츠/i.test(name))return"⛳";
  if(/Skill|Special/i.test(name))return"✨";
  if(/인증|시험|Cert/i.test(name))return"🎓";
  if(/참고|논문|원서/.test(name))return"📚";
  return"🎬";
}
function cleanCourse(name){return name.replace(/^\d+[a-z]?_/,"").replace(/_/g," ");}

/* ---- tree walkers ---- */
function allVideos(node,acc){acc=acc||[];
  for(const f of node.files||[]) if(f.kind==="video") acc.push({...f,_path:node.path});
  for(const c of node.children||[]) allVideos(c,acc);
  return acc;}
function docsIn(node,acc){acc=acc||[];
  for(const f of node.files||[]) if(f.kind==="doc") acc.push(f);
  for(const c of node.children||[]) docsIn(c,acc);
  return acc;}

/* ---- sidebar ---- */
function buildNav(){
  const nav=$("#nav");nav.innerHTML="";
  const g=document.createElement("div");g.className="grp";g.textContent="코스";nav.appendChild(g);
  DATA.courses.forEach((c,i)=>{
    const a=document.createElement("a");
    a.className="item"+(i===activeCourse&&!query?" active":"")+(c.video_count===0?" empty":"");
    a.href="#";
    a.innerHTML=`<span class="ic">${courseIcon(c.name)}</span>
      <span class="lbl">${cleanCourse(c.name)}</span>
      <span class="cnt">${c.video_count}</span>`;
    a.onclick=e=>{e.preventDefault();activeCourse=i;query="";$("#q").value="";render();closeDrawer();window.scrollTo(0,0);};
    nav.appendChild(a);
  });
}

/* ---- render ---- */
function render(){
  buildNav();
  const view=$("#view");
  if(query.trim()){renderSearch(view);return;}
  const c=DATA.courses[activeCourse];
  if(!c){view.innerHTML=`<div class="empty">코스가 없습니다.</div>`;return;}

  const frag=document.createDocumentFragment();
  const head=document.createElement("div");head.className="chead";
  head.innerHTML=`<div class="eyebrow">${courseIcon(c.name)} ${c.name.match(/^\d+[a-z]?/)?.[0]||""} · COURSE</div>
    <h1>${cleanCourse(c.name)}</h1>
    <div class="sub"><span><b>${c.video_count}</b> 영상</span>
    ${docsIn(c).length?`<span><b>${docsIn(c).length}</b> 자료</span>`:""}</div>`;
  frag.appendChild(head);

  const cdocs=docsIn(c);
  if(cdocs.length){
    const dr=document.createElement("div");dr.className="docrow";
    cdocs.slice(0,16).forEach(d=>{
      const a=document.createElement("a");a.className="doc";a.href=OPEN(d.id);a.target="_blank";a.rel="noopener";
      a.innerHTML=`<span>📄</span>${d.name}`;dr.appendChild(a);
    });
    frag.appendChild(dr);
  }

  const direct=(c.files||[]).filter(f=>f.kind==="video").map(v=>({...v,_path:c.path}));
  if(direct.length){frag.appendChild(topicHead("전체",direct.length));frag.appendChild(grid(direct));}
  (c.children||[]).forEach(ch=>{
    const vids=allVideos(ch);
    if(vids.length){frag.appendChild(topicHead(ch.name.replace(/_/g," "),vids.length));frag.appendChild(grid(vids));}
  });
  if(c.video_count===0){
    const e=document.createElement("div");e.className="empty";
    e.innerHTML=`<div class="big">🎬</div>이 코스에는 아직 영상이 없습니다.`;frag.appendChild(e);
  }
  view.innerHTML="";view.appendChild(frag);
}
function renderSearch(view){
  const q=query.trim().toLowerCase();const hits=[];let inTx=0;
  DATA.courses.forEach(c=>allVideos(c).forEach(v=>{
    const nameHit=v.name.toLowerCase().includes(q);
    const rec=TX&&TX[v.id];
    const txHit=!!(rec&&rec.t.toLowerCase().includes(q));
    if(nameHit||txHit){hits.push({...v,_course:c.name,_txHit:txHit&&!nameHit});if(txHit)inTx++;}
  }));
  const frag=document.createDocumentFragment();
  const head=document.createElement("div");head.className="chead";
  head.innerHTML=`<div class="eyebrow">⌕ 검색</div><h1>“${query}”</h1>
    <div class="sub"><span><b>${hits.length}</b> 영상</span>
    ${inTx?`<span>대본에서 <b>${inTx}</b>건</span>`:""}
    ${!TX?`<span style="color:var(--tx-3)">대본 불러오는 중…</span>`:""}</div>`;
  frag.appendChild(head);
  if(hits.length) frag.appendChild(grid(hits));
  else{const e=document.createElement("div");e.className="empty";
    e.innerHTML=`<div class="big">🔍</div>검색 결과가 없습니다.`;frag.appendChild(e);}
  view.innerHTML="";view.appendChild(frag);
}
function topicHead(name,n){
  const d=document.createElement("div");d.className="topic";
  d.innerHTML=`<span class="dot"></span><h2>${name}</h2><span class="n">${n}</span><span class="line"></span>`;
  return d;
}
function grid(vids){
  const g=document.createElement("div");g.className="grid";
  vids.forEach(v=>{
    const {topic,tags}=parse(v.name);
    const card=document.createElement("div");card.className="card";
    card.innerHTML=`
      <div class="thumb">
        <div class="ph">🎬</div>
        <img loading="lazy" src="${THUMB(v.id)}" alt="" onload="this.previousElementSibling.style.display='none'" onerror="this.remove()"/>
        <div class="play"><i></i></div>
        ${hasTx(v.id)?`<div class="cc">📝 대본</div>`:""}
      </div>
      <div class="meta">
        <div class="t">${topic||v.name}</div>
        ${v._txHit?`<div class="tags"><span class="tag">대본 일치</span></div>`:tags.length?`<div class="tags">${tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div>`:""}
      </div>`;
    card.onclick=()=>openModal(v);
    g.appendChild(card);
  });
  return g;
}

/* ---- modal ---- */
function openModal(v){
  const {topic}=parse(v.name);
  curTxId=v.id;
  $("#mttl").textContent=topic||v.name;
  $("#mframe").src=PREVIEW(v.id);
  $("#mopen").href=OPEN(v.id);
  $("#modal").classList.add("open");document.body.style.overflow="hidden";
  // transcript: reset panel, reveal toggle only if available
  $("#mbox").classList.remove("tx-open");
  $("#mtxToggle").classList.remove("on");$("#mtxToggle").setAttribute("aria-pressed","false");
  $("#mtxFind").value="";
  const tog=$("#mtxToggle");
  loadTx().then(()=>{
    if(curTxId!==v.id) return;            // modal changed while loading
    tog.style.display=hasTx(v.id)?"inline-block":"none";
    // auto-open transcript if a text query is active (came from a transcript hit)
    if(hasTx(v.id) && query.trim()) toggleTx(true);
  });
}
function closeModal(){
  $("#modal").classList.remove("open");$("#mframe").src="";document.body.style.overflow="";
  curTxId=null;
}
function renderTxBody(){
  const rec=TX&&TX[curTxId];const body=$("#mtxBody");
  if(!rec){body.innerHTML='<div class="tx-empty"><div class="big">📝</div>이 영상은 아직 대본이 없습니다.</div>';return;}
  const find=$("#mtxFind").value.trim();
  let html=escHtml(rec.t);
  if(find){
    const re=new RegExp(escRe(find),"gi");
    html=html.replace(re,m=>`<mark>${m}</mark>`);
  }
  const note=rec.p
    ? '<div class="tx-note">⚠️ 긴 영상이라 음성을 구간별로 모아 전사한 “요약 대본”입니다(전체 아님). 현장 통역을 AI로 자동 전사한 것이라 오타가 있을 수 있어요.</div>'
    : '<div class="tx-note">현장 통역을 AI(Whisper)로 자동 전사한 대본입니다. 오타가 있을 수 있어요.</div>';
  body.innerHTML=html+note;
  $("#mtxBadge").style.display=rec.p?"inline-block":"none";
  const secs=rec.d?Math.round(rec.d):0;
  $("#mtxCnt").textContent=(secs?`${Math.floor(secs/60)}:${String(secs%60).padStart(2,"0")} · `:"")+`${rec.t.length.toLocaleString()}자`;
}
function toggleTx(force){
  const box=$("#mbox"),tog=$("#mtxToggle");
  const open=force!==undefined?force:!box.classList.contains("tx-open");
  box.classList.toggle("tx-open",open);
  tog.classList.toggle("on",open);tog.setAttribute("aria-pressed",String(open));
  if(open) renderTxBody();
}
$("#mtxToggle").onclick=()=>toggleTx();
let txfT;$("#mtxFind").addEventListener("input",()=>{clearTimeout(txfT);txfT=setTimeout(renderTxBody,120);});
$("#mx").onclick=closeModal;
$("#modal").onclick=e=>{if(e.target.id==="modal")closeModal();};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});

/* ---- drawer (mobile) ---- */
function openDrawer(){$("#side").classList.add("open");$("#scrim").classList.add("show");}
function closeDrawer(){$("#side").classList.remove("open");$("#scrim").classList.remove("show");}
$("#burger").onclick=openDrawer;$("#scrim").onclick=closeDrawer;

/* ---- search ---- */
let sT;$("#q").addEventListener("input",e=>{
  query=e.target.value;clearTimeout(sT);
  if(query.trim()&&!TX) loadTx().then(()=>{if(query.trim())render();});  // full-text search needs transcripts
  sT=setTimeout(render,140);
});

/* ---- skeleton on load ---- */
function skeleton(){
  const v=$("#view");let h='<div class="chead"><div class="eyebrow">불러오는 중…</div><h1>DNS 강의 아카이브</h1></div><div class="grid">';
  for(let i=0;i<8;i++)h+='<div class="sk"><div class="b b1"></div><div class="b b2"></div><div class="b b3"></div></div>';
  v.innerHTML=h+'</div>';
}

/* ---- app boot (called only after gate passes / gate disabled) ---- */
let booted=false;
function bootApp(){
  if(booted) return; booted=true;
  skeleton();
  fetch("manifest.json?v="+Date.now()).then(r=>{
    if(!r.ok)throw new Error("manifest "+r.status);return r.json();
  }).then(d=>{
    DATA=d;
    const fi=d.courses.findIndex(c=>c.video_count>0);
    activeCourse=fi>=0?fi:0;
    render();
  }).catch(e=>{
    $("#view").innerHTML=`<div class="empty"><div class="big">⚠️</div>
      목록을 불러오지 못했습니다.<br><small style="color:var(--tx-3)">${e.message}</small></div>`;
  });
}

/* ---- auth gate ---------------------------------------------------------
   gate.json 이 없거나 enabled=false / worker_url 비어있으면 -> 바로 공개.
   활성 시: URL #dns_auth=<token> 캡처 -> localStorage 저장, Worker /verify 로
   재검증(위조 방지, 네트워크 실패 시 로컬 exp 폴백). 미인증이면 오버레이 노출. */
const GKEY="dns-session";
const gEl=id=>document.getElementById(id);
function parseHash(){
  const h=location.hash.replace(/^#/,"");if(!h)return{};
  const p=new URLSearchParams(h);const o={};
  for(const[k,v]of p)o[k]=v;return o;
}
function clearHash(){history.replaceState(null,"",location.pathname+location.search);}
function localValid(tok){
  try{const b=tok.split(".")[0].replace(/-/g,"+").replace(/_/g,"/");
    const j=JSON.parse(decodeURIComponent(escape(atob(b))));
    return j.exp&&j.exp>Date.now()?j:null;}catch{return null;}
}
async function verify(worker,tok){
  try{const r=await fetch(worker.replace(/\/+$/,"")+"/verify",{method:"POST",
    headers:{"Content-Type":"application/json"},body:JSON.stringify({token:tok})});
    if(!r.ok)return null;const d=await r.json();return d.ok?d.payload:null;
  }catch{return localValid(tok);}  // 워커 불통 시 로컬 만료검사로 폴백
}
function showGate(cfg,err){
  const g=gEl("gate");g.classList.add("show");
  if(cfg.title)gEl("gateTitle").textContent=cfg.title;
  if(cfg.subtitle)gEl("gateSub").textContent=cfg.subtitle;
  gEl("gateNote").textContent=cfg.note||"";
  gEl("gateErr").textContent=err||"";
  gEl("gateSpin").style.display="none";
  gEl("gateLogin").onclick=()=>{
    const ret=encodeURIComponent(location.origin+location.pathname);
    location.href=cfg.worker_url.replace(/\/+$/,"")+"/login?return="+ret;
  };
}
const ERRTXT={not_member:"디스코드 서버 멤버가 아닙니다. 수강 등록 후 초대받은 서버에 가입해주세요.",
  token_fail:"인증 교환에 실패했습니다. 다시 시도해주세요."};
async function initGate(){
  let cfg=null;
  try{cfg=await fetch("gate.json?v="+Date.now()).then(r=>r.ok?r.json():null);}catch{}
  // 게이트 비활성/미설정 -> 공개
  if(!cfg||!cfg.enabled||!cfg.worker_url){bootApp();return;}

  const hash=parseHash();
  if(hash.dns_err){clearHash();showGate(cfg,ERRTXT[hash.dns_err]||"인증 실패");return;}
  if(hash.dns_auth){                       // OAuth 콜백 복귀
    const tok=hash.dns_auth;clearHash();
    gEl("gate").classList.add("show");gEl("gateSpin").style.display="block";
    const ok=await verify(cfg.worker_url,tok);
    if(ok){localStorage.setItem(GKEY,tok);gEl("gate").classList.remove("show");bootApp();return;}
    showGate(cfg,"세션 검증에 실패했습니다. 다시 로그인해주세요.");return;
  }
  // 기존 세션 확인
  const saved=localStorage.getItem(GKEY);
  if(saved){
    if(!localValid(saved)){localStorage.removeItem(GKEY);showGate(cfg);return;}
    gEl("gate").classList.add("show");gEl("gateSpin").style.display="block";
    const ok=await verify(cfg.worker_url,saved);
    if(ok){gEl("gate").classList.remove("show");bootApp();return;}
    localStorage.removeItem(GKEY);showGate(cfg);return;
  }
  showGate(cfg);
}
initGate();
</script>
</body>
</html>
