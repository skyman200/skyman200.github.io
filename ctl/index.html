<link rel="apple-touch-icon" href="/ctl/apple-touch-icon.png">

<!-- 링크 미리보기(카카오톡 · Discord · 문자에 이 주소를 붙이면 링크 위에 뜨는 그림 · 제목 · 설명). 그림은 앱의 것을 그대로 쓴다(앱 저장소 src/app/opengraph-image.jpg).
     미리보기를 읽는 프로그램은 아래 자바스크립트를 돌리지 않으므로 이 페이지의 태그를 읽는다. og:url 은 두지 않는다(?j= 열쇠가 붙은 주소를 첫 주소로 바꿔 알리지 않게). -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="CTL 실마리">
<meta property="og:locale" content="ko_KR">
<meta property="og:title" content="CTL 실마리 — 엉킨 공부가 술술 풀린다">
<meta property="og:description" content="강의를 보고, 그 주에 모르는 것을 바로 묻고, 과제를 제출하세요.">
<meta property="og:image" content="https://ctl-learning.vercel.app/opengraph-image.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="CTL 실마리 첫 화면 — '엉킨 공부가 술술 풀린다.' 제목과 주차 강의 목록 · AI 복습 카드 · 로그인 버튼">
<meta name="twitter:card" content="summary_large_image">
<noscript><meta http-equiv="refresh" content="2;url=https://ctl-learning.vercel.app/"></noscript>
<style>
  html { background: #faf9f7; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font: 16px/1.6 -apple-system, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif; color: #1c1b19; }
  main { padding: 24px; max-width: 360px; }
  .brand { margin: 0; font-size: 14px; font-weight: 600; color: #1f6b4c; }
  h1 { margin: 10px 0 8px; font-size: 22px; letter-spacing: -0.01em; }
  p { margin: 0 0 8px; color: #6b665e; }
  a { color: #175c40; }
</style>
</head>
<body>
<main>
  <p class="brand">CTL</p>
  <h1>실마리로 이동합니다</h1>
  <p>잠시만 기다려 주세요. 자동으로 넘어가지 않으면 아래 주소를 눌러 주세요.</p>
  <p><a id="go" href="https://ctl-learning.vercel.app/">실마리 열기</a></p>
</main>
<script>
(function () {
  var APP = "https://ctl-learning.vercel.app";
  var j = (new URLSearchParams(location.search).get("j") || "").trim();
  // QR 의 열쇠: 분반 등록 코드(영문·숫자 6자) 또는 과목 id(uuid). 그 밖의 값은 무시하고 첫 화면으로 보낸다(임의 주소로 보내지 않음).
  var ok = /^[A-Za-z0-9]{6}$/.test(j) || /^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$/.test(j);
  var to = ok ? APP + "/join/" + encodeURIComponent(j) : APP + "/";
  document.getElementById("go").href = to;
  location.replace(to);
})();
</script>
</body>
</html>
